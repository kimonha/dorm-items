# Isolated PostgreSQL acceptance tests; never uses the service database or its volume.
name: dorm-items-test
services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dorm_acceptance
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_only_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U test_user -d dorm_acceptance"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://test_user:test_only_password@test-db:5432/dorm_acceptance
    depends_on:
      test-db:
        condition: service_healthy
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
